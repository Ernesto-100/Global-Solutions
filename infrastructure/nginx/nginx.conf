worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # Upstream services
    upstream api {
        server api:8000;
        keepalive 32;
    }
    upstream web {
        server web:3000;
        keepalive 16;
    }
    upstream app {
        server app:3001;
        keepalive 16;
    }
    upstream admin {
        server admin:3002;
        keepalive 8;
    }
    upstream agents {
        server agents:8001;
        keepalive 8;
    }

    # Marketing website — truebooks.io
    server {
        listen 80;
        server_name truebooks.io www.truebooks.io;

        # Redirect to HTTPS in production
        # return 301 https://$host$request_uri;

        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Core app — app.truebooks.io
    server {
        listen 80;
        server_name app.truebooks.io;

        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket support for live chat
        location /ws {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }
    }

    # API — api.truebooks.io
    server {
        listen 80;
        server_name api.truebooks.io;

        # Rate limiting
        location /auth/ {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # Admin — admin.truebooks.io (IP-restricted in production)
    server {
        listen 80;
        server_name admin.truebooks.io;

        # allow 10.0.0.0/8;  # Internal only in production
        # deny all;

        location / {
            proxy_pass http://admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
